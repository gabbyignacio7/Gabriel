name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/hey-it-011CUutT4Vfd84VTPvQhht1T]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './deep-see-dashboard/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./deep-see-dashboard

      - name: Build
        run: npm run build
        working-directory: ./deep-see-dashboard
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deep-see-dashboard/dist
          publish_branch: gh-pages
